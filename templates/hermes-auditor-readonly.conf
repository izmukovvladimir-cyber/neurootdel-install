# Installed by neurootdel-install: the Auditor is read-only at the kernel level.
# Every process of the unit (gateway, delegate_task children, terminal and execute_code subprocesses) shares this
# mount namespace: the home tree is read-only except the engine's own state; the files that define the Auditor
# (role, settings, keys, plugins, engine code) stay read-only even inside it. Reading is unaffected.
# "-" = skip a path that does not exist yet.
# Stop: sudo rm /etc/systemd/system/hermes-auditor.service.d/10-readonly.conf && sudo systemctl daemon-reload && sudo systemctl restart hermes-auditor
[Service]
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
NoNewPrivileges=yes
ReadWritePaths={{HERMES_HOME}} -{{HOME}}/.local/state/hermes -{{HOME}}/.cache
ReadOnlyPaths={{HERMES_HOME}}/.env {{HERMES_HOME}}/SOUL.md {{HERMES_HOME}}/config.yaml {{HERMES_HOME}}/plugins -{{HERMES_HOME}}/hermes-agent
