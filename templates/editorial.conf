# Editorial loop settings (codex-check skill + text-critics.sh). Written once by the installer, yours afterwards.
# Plain KEY=value lines, no quotes inside values. Read by the scripts, never executed.
# Switched OFF until you log into Codex under the agent user (lesson: docs/lesson-editorial.md):
#   1) install Codex CLI, 2) sudo -u {{USER}} -H codex login, 3) EDITORIAL_ENABLED=1 below.
EDITORIAL_ENABLED=0
# Model for `codex exec -m`; empty = Codex's own default for your ChatGPT plan.
CODEX_CHECK_MODEL=
# Your text standard (fill it from your edits) and the codex-check script of the skill.
TEXT_STANDARD=~/.claude-lab/shared/checklists/text-standard.md
CODEX_CHECK_BIN=~/.claude-lab/jarvis/.claude/skills/codex-check/scripts/codex-check.sh
# One line for both critics: whose text, for whom, in what voice. Example: Telegram channel of an online school owner, for school owners, in the author's conversational voice.
CRITICS_CONTEXT=
